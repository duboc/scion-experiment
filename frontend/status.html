<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Status</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .status-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .status-grid {
      display: grid;
      gap: 1.25rem;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .status-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-value {
      font-size: 1.125rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-main);
    }

    .footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="status-card">
    <div class="header">
      <h1 class="title">Service Status</h1>
      <div class="badge" id="badge-status">
        <span class="badge-dot"></span>
        <span id="status-pill">OK</span>
      </div>
    </div>

    <div class="status-grid">
      <div class="status-item">
        <span class="status-label">Service</span>
        <span class="status-value" id="service-name">meu-projeto-api</span>
      </div>

      <div class="status-item">
        <span class="status-label">Status</span>
        <span class="status-value" id="status-val">ok</span>
      </div>

      <div class="status-item">
        <span class="status-label">Orchestrator</span>
        <span class="status-value" id="orchestrator-name">lead</span>
      </div>
    </div>

    <footer class="footer">
      <span id="last-updated">Status: Operational</span>
    </footer>
  </main>

  <script>
    // Optional dynamic update from backend status if available
    (async function checkBackendStatus() {
      try {
        const response = await fetch('../backend/status.json');
        if (response.ok) {
          const data = await response.json();
          if (data.service) {
            document.getElementById('service-name').textContent = data.service;
          }
          if (data.status) {
            document.getElementById('status-val').textContent = data.status;
            document.getElementById('status-pill').textContent = String(data.status).toUpperCase();
          }
          if (data.orchestrator) {
            document.getElementById('orchestrator-name').textContent = data.orchestrator;
          }
          const updatedEl = document.getElementById('last-updated');
          if (updatedEl) {
            updatedEl.textContent = 'Synced with backend status';
          }
        }
      } catch (err) {
        // Fallback to hardcoded values when running standalone / static
      }
    })();
  </script>
</body>
</html>
